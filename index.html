<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Nivra | Legend Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* استایل لابی اصلی */
        #lobby-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            z-index: 1000;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            transition: opacity 1s ease-out;
        }

        /* تیتر بازی با استایل افسانه‌ای */
        #game-title {
            position: absolute;
            top: 20%;
            color: white;
            font-size: 60px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.8), 0 0 40px rgba(0, 150, 255, 0.4);
            animation: titleGlow 3s infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 20px rgba(0, 150, 255, 0.8); }
            to { text-shadow: 0 0 40px rgba(255, 0, 50, 0.8), 0 0 60px rgba(255, 0, 50, 0.4); }
        }

        /* دکمه شروع حرفه‌ای */
        #start-btn {
            margin-bottom: 80px;
            padding: 20px 80px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 1001;
        }

        #start-btn:active {
            transform: scale(0.9);
            background: rgba(0, 150, 255, 0.4);
            border-color: #0096ff;
        }

        /* لایه مخفی برای بازی */
        #game-ui {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* هشدار چرخش گوشی */
        #orientation-warning {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            color: white; text-align: center; justify-content: center; align-items: center;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning { display: flex; flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div style="font-size: 50px;">🔄</div>
        <p>لطفاً گوشی را در حالت افقی نگه دارید</p>
    </div>

    <!-- بخش لابی سینمایی -->
    <div id="lobby-container">
        <h1 id="game-title">NIVRA</h1>
        <button id="start-btn">START MISSION</button>
    </div>

    <!-- بخش رابط کاربری بازی (بعد از شروع) -->
    <div id="game-ui">
        <!-- اینجا کدهای HUD قبلی را قرار می‌دهیم -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ۱. تنظیمات پایه صحنه
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ۲. ساخت سیستم ذرات (آتش آبی و قرمز برای لابی)
        const particlesGeometry = new THREE.BufferGeometry();
        const count = 500;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 20;
            colors[i] = Math.random();
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // ۳. نورپردازی محیط لابی
        const ambientLight = new THREE.AmbientLight(0x404040, 2); 
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x0096ff, 2, 10);
        pointLight.position.set(0, 2, 0);
        scene.add(pointLight);

        camera.position.z = 5;

        // ۴. انیمیشن ذرات (حرکت آتش و انرژی)
        function animateParticles() {
            const positions = particlesGeometry.attributes.position.array;
            const colors = particlesGeometry.attributes.color.array;

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                // حرکت آرام به سمت بالا (مثل دود یا شعله)
                positions[i3 + 1] += 0.01; 
                
                // اگر ذره از صفحه خارج شد، برگردان به پایین
                if (positions[i3 + 1] > 5) {
                    positions[i3 + 1] = -5;
                }

                // تغییر رنگ بین آبی و قرمز (افکت آتش)
                const time = Date.now() * 0.001;
                colors[i3] = Math.sin(time + i) * 0.5 + 0.5; // Red channel
                colors[i3 + 1] = Math.cos(time + i) * 0.5;   // Green
                colors[i3 + 2] = 1.0;                         // Blue (Blue dominant)
            }
            particlesGeometry.attributes.position.needsUpdate = true;
            particlesGeometry.attributes.color.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            animateParticles();
            
            // چرخش بسیار آرام دوربین برای حس سینمایی
            camera.rotation.y += 0.001;
            camera.rotation.x = Math.sin(Date.now() * 0.0005) * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // ۵. منطق شروع بازی
        const startBtn = document.getElementById('start-btn');
        const lobby = document.getElementById('lobby-container');
        const gameUI = document.getElementById('game-ui');

        startBtn.addEventListener('click', () => {
            // افکت محو شدن لابی
            lobby.style.opacity = '0';
            setTimeout(() => {
                lobby.style.display = 'none';
                gameUI.style.display = 'block';
                initGameWorld(); // فراخوانی دنیای اصلی بازی
            }, 1000);
        });

        // تابع جایگزین برای دنیای اصلی (باید با کدهای مرحله قبل ادغام شود)
        function initGameWorld() {
            console.log("Entering the Battlefield...");
            // اینجا باید کدهای حرکت و اسلحه که قبلا نوشتیم قرار بگیرد
            // فعلاً برای تست فقط رنگ پس‌زمینه عوض می‌شود
            scene.background = new THREE.Color(0x05080c);
            document.body.style.background = "#05080c";
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
