<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivra Uno Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h1>Nivra Uno</h1>
        
        <button id="start-btn" onclick="startGame()">شروع بازی</button>
        
        <div id="game-area" style="display:none;">
            <p>کارت روی زمین:</p>
            <div id="discard-pile"></div>
            <div class="controls">
                <button id="draw-btn" onclick="drawCard()">کارت کشیدن</button>
            </div>
        </div>

        <hr>
        <h3>دست شما:</h3>
        <div id="player-hand"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
