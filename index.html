<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیورا | Nivra Shooter</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f19;
            color: #fff;
        }
        /* Portrait Mode Container */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- MAIN MENU (LOBBY) --- */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 10;
        }
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .user-profile img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #f59e0b;
        }
        .currencies {
            display: flex;
            gap: 15px;
        }
        .currency-item {
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .currency-item i { color: #f59e0b; }

        .menu-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }
        .hero-display {
            width: 100%;
            height: 250px;
            background: radial-gradient(circle, rgba(245,158,11,0.2) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: #f59e0b;
            text-shadow: 0 0 20px rgba(245,158,11,0.5);
        }
        .game-modes {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .mode-btn {
            background: rgba(31, 41, 55, 0.8);
            border: 2px solid #374151;
            padding: 8px 16px;
            border-radius: 10px;
            color: #9ca3af;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .mode-btn.active {
            border-color: #f59e0b;
            color: #fff;
            background: rgba(245, 158, 11, 0.2);
        }

        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
        }
        .start-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(245,158,11,0.4);
            cursor: pointer;
        }
        .nav-icons {
            display: flex;
            gap: 15px;
        }
        .nav-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- IN-GAME HUD --- */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            display: none;
            padding: 15px;
            flex-direction: column;
            justify-content: space-between;
        }
        .interactive { pointer-events: auto; }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .hud-top-left {
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            border-left: 4px solid #ef4444;
        }
        .hud-top-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .minimap {
            width: 90px;
            height: 90px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #374151;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }
        .player-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            position: absolute;
            top: 41px;
            left: 41px;
            box-shadow: 0 0 5px #22c55e;
        }
        .hud-btn-top {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        .crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        .crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        /* Joystick */
        .joystick-zone {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(245, 158, 11, 0.6);
            border: 2px solid #f59e0b;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
        }
        .action-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }
        .fire-btn {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ef4444 0%, #b91c1c 100%);
            border: 3px solid #fca5a5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            cursor: pointer;
        }
        .ammo-display {
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border-right: 4px solid #f59e0b;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- MAIN MENU -->
        <div id="main-menu">
            <div class="menu-header">
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" alt="Avatar">
                    <div>
                        <div style="font-size: 13px; font-weight: bold;">Ebitiem</div>
                        <div style="font-size: 10px; color: #10b981;">● آنلاین</div>
                    </div>
                </div>
                <div class="currencies">
                    <div class="currency-item"><i class="fa-solid fa-coins"></i> 1,450</div>
                    <div class="currency-item"><i class="fa-solid fa-gem"></i> 120</div>
                </div>
            </div>

            <div class="menu-center">
                <div class="hero-display">
                    <i class="fa-solid fa-gun"></i>
                </div>
                <div style="font-size: 22px; font-weight: bold; color: #f59e0b; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">نیورا | NIVRA</div>
                <div style="font-size: 12px; color: #9ca3af; margin-top: 5px;">محیط نبرد سه‌بعدی آنلاین</div>

                <div class="game-modes">
                    <button class="mode-btn active" onclick="setMode(1)">تک‌نفره</button>
                    <button class="mode-btn" onclick="setMode(2)">دونفره</button>
                    <button class="mode-btn" onclick="setMode(4)">۴ نفره</button>
                    <button class="mode-btn" onclick="setMode(8)">۸ نفره</button>
                </div>
            </div>

            <div class="menu-footer">
                <div class="nav-icons">
                    <div class="nav-icon" title="تنظیمات"><i class="fa-solid fa-gear"></i></div>
                    <div class="nav-icon" title="صدا"><i class="fa-solid fa-volume-high"></i></div>
                </div>
                <button class="start-btn" onclick="startGame()">شروع بازی</button>
                <div class="nav-icons">
                    <div class="nav-icon" title="دوستان"><i class="fa-solid fa-user-group"></i></div>
                    <div class="nav-icon" title="فروشگاه"><i class="fa-solid fa-store"></i></div>
                </div>
            </div>
        </div>

        <!-- THREE.JS GAME CANVAS -->
        <canvas id="game-canvas"></canvas>

        <!-- IN-GAME HUD -->
        <div id="hud">
            <div class="hud-top">
                <div class="hud-top-left">
                    <div style="font-size: 12px; color: #9ca3af;">وضعیت تیم</div>
                    <div style="font-weight: bold; color: #22c55e;">امتیاز: <span id="score">0</span></div>
                </div>
                <div class="hud-top-right">
                    <div class="hud-btn-top interactive" onclick="toggleMic()" id="mic-btn"><i class="fa-solid fa-microphone"></i></div>
                    <div class="hud-btn-top interactive" onclick="returnToMenu()"><i class="fa-solid fa-house"></i></div>
                    <div class="minimap">
                        <div class="player-dot" id="minimap-dot"></div>
                    </div>
                </div>
            </div>

            <div class="crosshair"></div>

            <div class="hud-bottom">
                <div class="joystick-zone interactive" id="joystick">
                    <div class="joystick-knob" id="joystick-knob"></div>
                </div>
                <div class="action-zone">
                    <div class="ammo-display">۳۰ / <span style="color: #f59e0b;">۹۰</span></div>
                    <div class="fire-btn interactive" id="fire-btn"><i class="fa-solid fa-crosshairs"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, player;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let gameRunning = false;

        function setMode(players) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-canvas').style.display = 'block';
            document.getElementById('hud').style.display = 'flex';
            gameRunning = true;
            initThreeJS();
        }

        function returnToMenu() {
            gameRunning = false;
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('game-canvas').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            btn.style.color = btn.style.color === 'rgb(239, 68, 68)' ? '#fff' : '#ef4444';
        }

        function initThreeJS() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // آسمان روز روشن

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // نورپردازی
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // زمین
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x4b5563 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // موانع (مانند جعبه‌ها و ساختمان‌ها)
            const boxGeo = new THREE.BoxGeometry(4, 4, 4);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            for (let i = 0; i < 15; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random() - 0.5) * 60, 2, (Math.random() - 0.5) * 60);
                scene.add(box);
            }

            camera.position.set(0, 2, 5);

            // رندر لوپ
            function animate() {
                if (!gameRunning) return;
                requestAnimationFrame(animate);

                if (moveForward) camera.position.z -= 0.1;
                if (moveBackward) camera.position.z += 0.1;
                if (moveLeft) camera.position.x -= 0.1;
                if (moveRight) camera.position.x += 0.1;

                renderer.render(scene, camera);
            }
            animate();
        }

        // کنترل جوی‌استیک لمسی ساده
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let joystickActive = false;

        joystick.addEventListener('touchstart', (e) => { joystickActive = true; });
        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;

            moveForward = dy < -10;
            moveBackward = dy > 10;
            moveLeft = dx < -10;
            moveRight = dx > 10;
        });

        window.addEventListener('touchend', () => {
            joystickActive = false;
            knob.style.transform = `translate(0px, 0px)`;
            moveForward = moveBackward = moveLeft = moveRight = false;
        });

        // دکمه شلیک
        document.getElementById('fire-btn').addEventListener('click', () => {
            let scoreElem = document.getElementById('score');
            scoreElem.innerText = parseInt(scoreElem.innerText) + 10;
        });
    </script>
</body>
</html>
