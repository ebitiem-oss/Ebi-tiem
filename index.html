<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیورا | Nivra Shooter</title>
    <link rel="stylesheet" href="style.css">
    <!-- بارگذاری کتابخانه Three.js برای گرافیک سه‌بعدی -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- لابی اصلی بازی -->
    <div id="lobby-screen" class="screen">
        <div class="top-bar">
            <div class="profile-badge">
                <span class="wolf-icon">🐺</span>
                <span id="player-name">EbiTiem</span>
                <span class="tag-code">#NEV-7482</span>
            </div>
            <div class="currency-badge" id="player-coins">💰 5000</div>
            <button class="icon-btn" onclick="openSettings()">⚙️</button>
        </div>

        <div class="lobby-content">
            <div class="logo-container">
                <h1 class="game-title">NIVRA | نیورا</h1>
                <p class="game-subtitle">بازی تاکتیکی آنلاین</p>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('solo')">تک‌نفره (Solo)</button>
                <button class="mode-btn" onclick="setMode('duo')">۲ نفره</button>
                <button class="mode-btn" onclick="setMode('squad4')">۴ نفره</button>
                <button class="mode-btn" onclick="setMode('squad8')">۸ نفره</button>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" onclick="openTeamSelect()">شروع بازی (Matchmaking)</button>
                <button class="btn-secondary" onclick="openShop()">فروشگاه سلاح و اسکین</button>
            </div>
        </div>
    </div>

    <!-- صفحه انتخاب تیم (Counter-Terrorist vs Terrorist) -->
    <div id="team-screen" class="screen hidden">
        <div class="team-container">
            <h2>انتخاب تیم</h2>
            <div class="team-cards">
                <div class="team-card ct" onclick="startGame('CT')">
                    <h3>نیروهای ویژه (CT)</h3>
                    <p>پاسبانان قانون و امنیت</p>
                </div>
                <div class="team-card t" onclick="startGame('T')">
                    <h3>تروریست‌ها (T)</h3>
                    <p>نیروی مهاجم و تهاجمی</p>
                </div>
            </div>
            <button class="btn-back" onclick="closeTeamSelect()">بازگشت</button>
        </div>
    </div>

    <!-- صفحه بازی سه‌بعدی -->
    <div id="game-screen" class="screen hidden">
        <div id="canvas-container"></div>
        
        <!-- هداپ (HUD) داخل بازی -->
        <div class="game-hud">
            <div class="score-board">تیم T: 0 | تیم CT: 0</div>
            <button class="pause-btn" onclick="openSettings()">⚙️</button>
        </div>

        <!-- کنترل‌های لمسی موبایل (جوی‌استیک و دکمه‌های شلیک) -->
        <div class="mobile-controls">
            <div class="joystick-area" id="joystick-zone">
                <div class="dpad">
                    <button class="d-btn" ontouchstart="moveForward=true" ontouchend="moveForward=false">⬆️</button>
                    <div class="d-row">
                        <button class="d-btn" ontouchstart="moveLeft=true" ontouchend="moveLeft=false">⬅️</button>
                        <button class="d-btn" ontouchstart="moveRight=true" ontouchend="moveRight=false">➡️</button>
                    </div>
                    <button class="d-btn" ontouchstart="moveBackward=true" ontouchend="moveBackward=false">⬇️</button>
                </div>
            </div>

            <div class="action-area">
                <button class="action-btn" onclick="playerJump()">پرش 🦘</button>
                <button class="action-btn" onclick="playerReload()">خشاب 🔄</button>
                <!-- دکمه شلیک پیشرفته: تپ برای تک‌تیر، نگه داشتن برای رگبار -->
                <button class="fire-btn" ontouchstart="startShooting()" ontouchend="stopShooting()" onmousedown="startShooting()" onmouseup="stopShooting()"> آتش 🔥</button>
            </div>
        </div>
    </div>

    <!-- مدال تنظیمات (صدا و چیدمان دکمه‌ها) -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>⚙️ تنظیمات بازی</h2>
            <div class="setting-item">
                <label>صدای بازی (SFX):</label>
                <input type="range" min="0" max="100" value="80" onchange="updateVolume(this.value)">
            </div>
            <div class="setting-item">
                <label>حساسیت چرخش دوربین:</label>
                <input type="range" min="1" max="10" value="5" onchange="updateSensitivity(this.value)">
            </div>
            <div class="setting-item">
                <label>چیدمان دکمه‌ها (HUD Layout):</label>
                <button class="btn-small" onclick="alert('حالت چیدمان آزاد فعال شد. دکمه‌ها را جابجا کنید.')">ویرایش چیدمان</button>
            </div>
            <button class="btn-primary" onclick="closeSettings()">ذخیره و بازگشت</button>
            <button class="btn-danger" onclick="exitGame()">خروج از مسابقه</button>
        </div>
    </div>

    <!-- فروشگاه اسلحه -->
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🛒 فروشگاه تجهیزات</h2>
            <div class="shop-items">
                <div class="shop-item">
                    <span>M4A1 تاکتیکی</span>
                    <button onclick="buyItem('M4A1 تاکتیکی', 1500)">خرید (1500 💰)</button>
                </div>
                <div class="shop-item">
                    <span>AK-47 آتشین</span>
                    <button onclick="buyItem('AK-47 آتشین', 2000)">خرید (2000 💰)</button>
                </div>
                <div class="shop-item">
                    <span>AWM اسنایپر</span>
                    <button onclick="buyItem('AWM اسنایپر', 3500)">خرید (3500 💰)</button>
                </div>
            </div>
            <button class="btn-primary" onclick="closeShop()">بستن</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
