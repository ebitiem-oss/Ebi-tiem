<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیورا - بازی اونو آنلاین</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        /* Auth Screen */
        .auth-container {
            max-width: 400px;
            margin: auto;
            padding: 24px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 90%;
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent-color);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            height: 60px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item span.icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* Top Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .app-header h3 {
            font-size: 18px;
        }

        /* Telegram PV Style Lists */
        .pv-list {
            display: flex;
            flex-direction: column;
        }

        .pv-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .pv-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pv-info {
            flex: 1;
            min-width: 0;
        }

        .pv-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pv-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Seats Dots */
        .seats-dots {
            display: flex;
            gap: 3px;
            margin-top: 6px;
        }

        .seat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
        }

        .seat-dot.filled {
            background: var(--success);
        }

        /* Inside Room Layout */
        .room-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-color);
        }

        .room-header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .back-arrow {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
        }

        .room-players-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 12px;
        }

        .player-row.empty {
            opacity: 0.5;
        }

        .player-details {
            flex: 1;
        }

        .player-name {
            font-weight: bold;
            font-size: 15px;
        }

        .player-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .ready-badge {
            color: var(--success);
            font-weight: bold;
            font-size: 18px;
        }

        /* Bottom Chat & Mic */
        .room-bottom-controls {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        .room-bottom-controls input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent-color);
        }

        /* Settings Screen */
        .settings-content {
            padding: 16px;
        }
        
        .settings-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Auth / Login Screen -->
    <div id="authScreen" class="screen active">
        <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
            <div class="auth-container">
                <h2>ورود به نیورا</h2>
                <div class="input-group">
                    <label>آیدی کاربری</label>
                    <input type="text" id="usernameInput" placeholder="آیدی خود را وارد کنید">
                </div>
                <div class="input-group">
                    <label>رمز عبور (۸ کاراکتر)</label>
                    <input type="password" id="passwordInput" placeholder="رمز عبور">
                </div>
                <button class="btn" onclick="login()">ورود به بازی</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="mainApp" class="screen" style="display: none; flex-direction: column;">
        
        <!-- Content Area -->
        <div style="flex: 1; overflow-y: auto; position: relative;">
            
            <!-- 1. Games Screen (Default) -->
            <div id="tabGames" class="tab-content">
                <div class="app-header">
                    <h3>اتاق‌های بازی اونو</h3>
                    <button class="btn" style="width: auto; padding: 6px 12px; font-size: 13px;" onclick="createRoom()">ساخت اتاق</button>
                </div>
                <div class="pv-list" id="roomsListContainer">
                    <!-- Dynamic Rooms List -->
                </div>
            </div>

            <!-- 2. Messenger Screen -->
            <div id="tabMessenger" class="tab-content" style="display: none;">
                <div class="app-header">
                    <h3>پیام‌رسان (چت خصوصی)</h3>
                </div>
                <div class="pv-list">
                    <div class="pv-item" onclick="openPV('ربات پشتیبان نیورا')">
                        <div class="avatar">پ</div>
                        <div class="pv-info">
                            <div class="pv-title">ربات پشتیبان نیورا</div>
                            <div class="pv-subtitle">خوش آمدید! برای راهنمایی پیام دهید.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Settings Screen -->
            <div id="tabSettings" class="tab-content" style="display: none;">
                <div class="app-header">
                    <h3>تنظیمات و پروفایل</h3>
                </div>
                <div class="settings-content">
                    <div class="settings-card" style="text-align: center;">
                        <div class="avatar" style="width: 80px; height: 80px; margin: 0 auto 12px auto; cursor: pointer;" onclick="document.getElementById('avatarUpload').click();">
                            <img id="profileImg" src="" style="display: none;" alt="Profile">
                            <span id="avatarPlaceholder">📷</span>
                        </div>
                        <input type="file" id="avatarUpload" style="display: none;" accept="image/*" onchange="loadAvatar(event)">
                        <h4 id="profileUsernameName">کاربر نیورا</h4>
                        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">تغییر آیدی: فقط یک‌بار رایگان</p>
                    </div>

                    <div class="settings-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <span>صدای بازی</span>
                            <input type="checkbox" checked onchange="toggleSound(this)">
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span>دعوت دوستان</span>
                            <input type="checkbox" checked>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Inside Room Screen (Hidden by default) -->
            <div id="roomInsideScreen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 10; flex-direction: column;">
                <div class="room-header">
                    <button class="back-arrow" onclick="exitRoom()">←</button>
                    <div class="avatar" style="width: 36px; height: 36px; font-size: 14px;" id="roomHostAvatar">م</div>
                    <div style="flex: 1; min-width: 0;">
                        <div id="roomTitle" style="font-weight: bold; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">اتاق میزبان</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">اتاق اونو (تا ۱۰ بازیکن)</div>
                    </div>
                </div>

                <!-- Vertical 1-to-10 Telegram PV style rows for seats -->
                <div class="room-players-list" id="roomPlayersList">
                    <!-- Generated via JS -->
                </div>

                <!-- Bottom Chat & Mic -->
                <div class="room-bottom-controls">
                    <button class="icon-btn" title="میکروفون">🎤</button>
                    <input type="text" placeholder="پیام در اتاق...">
                    <button class="icon-btn" title="ارسال">➤</button>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a class="nav-item active" onclick="switchTab('Games', this)">
                <span class="icon">🎮</span>
                <span>بازی‌ها</span>
            </a>
            <a class="nav-item" onclick="switchTab('Messenger', this)">
                <span class="icon">💬</span>
                <span>پیام‌رسان</span>
            </a>
            <a class="nav-item" onclick="switchTab('Settings', this)">
                <span class="icon">⚙️</span>
                <span>تنظیمات</span>
            </a>
        </nav>
    </div>

    <script>
        let currentUser = "";
        let rooms = [
            { id: 1, host: "سارا", playersCount: 3, maxPlayers: 10, avatar: "س" },
            { id: 2, host: "علی", playersCount: 7, maxPlayers: 10, avatar: "ع" }
        ];

        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            if (!username || pass.length < 8) {
                alert('لطفاً آیدی و رمز عبور معتبر (حداقل ۸ کاراکتر) وارد کنید.');
                return;
            }
            currentUser = username;
            document.getElementById('profileUsernameName').innerText = username;
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('mainApp').style.display = 'flex';
            renderRooms();
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('tab' + tabName).style.display = 'block';
            el.classList.add('active');
            document.getElementById('roomInsideScreen').style.display = 'none';
        }

        function renderRooms() {
            const container = document.getElementById('roomsListContainer');
            container.innerHTML = '';
            
            rooms.forEach(room => {
                let dotsHtml = '';
                for (let i = 0; i < room.maxPlayers; i++) {
                    dotsHtml += `<div class="seat-dot ${i < room.playersCount ? 'filled' : ''}"></div>`;
                }

                container.innerHTML += `
                    <div class="pv-item" onclick="joinRoom(${room.id})">
                        <div class="avatar">${room.avatar}</div>
                        <div class="pv-info">
                            <div class="pv-title">${room.host}</div>
                            <div class="pv-subtitle">بازیکنان: ${room.playersCount} از ${room.maxPlayers}</div>
                            <div class="seats-dots">${dotsHtml}</div>
                        </div>
                    </div>
                `;
            });
        }

        function createRoom() {
            const newRoom = {
                id: rooms.length + 1,
                host: currentUser,
                playersCount: 1,
                maxPlayers: 10,
                avatar: currentUser.charAt(0).toUpperCase()
            };
            rooms.unshift(newRoom);
            renderRooms();
            joinRoom(newRoom.id);
        }

        function joinRoom(roomId) {
            const room = rooms.find(r => r.id === roomId);
            if (!room) return;

            document.getElementById('roomTitle').innerText = room.host;
            document.getElementById('roomHostAvatar').innerText = room.avatar;
            
            const listContainer = document.getElementById('roomPlayersList');
            listContainer.innerHTML = '';

            // Generate 10 vertical rows like Telegram PV list
            for (let i = 1; i <= room.maxPlayers; i++) {
                if (i <= room.playersCount) {
                    // Occupied seat (with profile, name, level, ready tick)
                    listContainer.innerHTML += `
                        <div class="player-row">
                            <div class="avatar" style="width: 40px; height: 40px; font-size: 14px;">${i === 1 ? room.avatar : 'ک'}</div>
                            <div class="player-details">
                                <div class="player-name">${i === 1 ? room.host + ' (میزبان)' : 'کاربر مهمان ' + i}</div>
                                <div class="player-meta">لینک سطح: ${i * 5}</div>
                            </div>
                            <div class="ready-badge">✓</div>
                        </div>
                    `;
                } else {
                    // Empty seat (NO levels, NO ticks, clean placeholder)
                    listContainer.innerHTML += `
                        <div class="player-row empty">
                            <div class="avatar" style="width: 40px; height: 40px; font-size: 14px; background: transparent; border: 1px dashed var(--border-color);">خالی</div>
                            <div class="player-details">
                                <div class="player-name" style="color: var(--text-secondary);">صندلی خالی ${i}</div>
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('roomInsideScreen').style.display = 'flex';
        }

        function exitRoom() {
            document.getElementById('roomInsideScreen').style.display = 'none';
        }

        function loadAvatar(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('profileImg');
                output.src = reader.result;
                output.style.display = 'block';
                document.getElementById('avatarPlaceholder').style.display = 'none';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        function toggleSound(el) {
            console.log("Sound toggled:", el.checked);
        }

        function openPV(name) {
            alert('باز کردن چت خصوصی با ' + name);
        }
    </script>
</body>
</html>
