<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیورا | Nivra Shooter</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f19;
            color: #fff;
        }
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- COD STYLE MENU --- */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
            z-index: 10;
        }
        .menu-header { display: flex; justify-content: space-between; align-items: center; }
        .user-profile { display: flex; align-items: center; gap: 12px; background: rgba(15, 23, 42, 0.8); padding: 8px 18px; border-radius: 25px; border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #f59e0b; object-fit: cover; }
        
        .menu-center { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        .game-title-box { text-align: center; margin-bottom: 20px; }
        .game-title-box h1 { font-size: 38px; color: #f59e0b; text-shadow: 0 0 15px rgba(245,158,11,0.6); letter-spacing: 2px; }
        .game-title-box p { font-size: 13px; color: #94a3b8; margin-top: 5px; }

        .game-modes { display: flex; gap: 12px; margin-top: 15px; }
        .mode-btn { background: rgba(30, 41, 59, 0.9); border: 2px solid #334155; padding: 10px 25px; border-radius: 8px; color: #94a3b8; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .mode-btn.active { border-color: #f59e0b; color: #fff; background: rgba(245, 158, 11, 0.25); box-shadow: 0 0 15px rgba(245,158,11,0.3); }

        .menu-footer { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .start-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff; border: none; padding: 14px 60px; font-size: 22px; font-weight: bold; border-radius: 35px; cursor: pointer; box-shadow: 0 6px 25px rgba(245,158,11,0.5); text-transform: uppercase; letter-spacing: 1px; }
        .start-btn:active { transform: scale(0.96); }

        /* --- GAME HUD (Landscape COD Style) --- */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; padding: 20px; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }

        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .minimap { width: 120px; height: 120px; background: rgba(15, 23, 42, 0.7); border: 2px solid rgba(245, 158, 11, 0.4); border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .player-dot { width: 9px; height: 9px; background: #22c55e; border-radius: 50%; position: absolute; top: 55px; left: 55px; box-shadow: 0 0 5px #22c55e; }

        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; pointer-events: none; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 3px rgba(0,0,0,0.8); }
        .crosshair::before { top: 13px; left: 0; width: 28px; height: 2px; }
        .crosshair::after { top: 0; left: 13px; width: 2px; height: 28px; }

        /* Weapon View Model at Bottom Center */
        .weapon-view {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-30%);
            width: 240px;
            height: 170px;
            background: linear-gradient(135deg, #334155, #0f172a);
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            pointer-events: none;
            z-index: 3;
            border-top: 4px solid #f59e0b;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.4);
        }

        .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        
        /* Left Joystick (Move) */
        .joystick-zone { width: 140px; height: 140px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; position: relative; touch-action: none; backdrop-filter: blur(2px); }
        .joystick-knob { width: 60px; height: 60px; background: rgba(245, 158, 11, 0.5); border: 2px solid #f59e0b; border-radius: 50%; position: absolute; top: 38px; left: 38px; pointer-events: none; box-shadow: 0 0 10px rgba(245,158,11,0.5); }

        /* Right Action Area (Fire & Aim Look) */
        .right-control-zone { display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .fire-btn { width: 90px; height: 90px; background: radial-gradient(circle, #ef4444 0%, #991b1b 100%); border: 3px solid #fca5a5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; box-shadow: 0 0 20px rgba(239, 68, 68, 0.7); cursor: pointer; }
        .ammo-box { background: rgba(15, 23, 42, 0.8); padding: 8px 18px; border-radius: 8px; font-size: 16px; font-weight: bold; border-right: 4px solid #f59e0b; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="app">
        <!-- MAIN MENU (COD Style) -->
        <div id="main-menu">
            <div class="menu-header">
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" alt="Avatar">
                    <div style="font-size: 14px; font-weight: bold;">Ebitiem</div>
                </div>
                <div style="background:rgba(15, 23, 42, 0.8); padding:6px 16px; border-radius:20px; font-size:14px; border: 1px solid rgba(255,255,255,0.1);"><i class="fa-solid fa-coins" style="color:#f59e0b;"></i> 1,450</div>
            </div>

            <div class="menu-center">
                <div class="game-title-box">
                    <h1>NIVRA // نیورا</h1>
                    <p>محیط نبرد تاکتیکی سه‌بعدی آنلاین</p>
                </div>

                <div class="game-modes">
                    <button class="mode-btn active">تک‌نفره</button>
                    <button class="mode-btn">۲ نفره</button>
                    <button class="mode-btn">۴ نفره</button>
                    <button class="mode-btn">۸ نفره</button>
                </div>
            </div>

            <div class="menu-footer">
                <div style="font-size: 12px; color: #64748b;">نسخه آنلاین موبایل</div>
                <button class="start-btn" onclick="startGame()">شروع نبرد</button>
                <div style="font-size: 12px; color: #64748b;"><i class="fa-solid fa-signal" style="color: #22c55e;"></i> پینگ: ۲۸ms</div>
            </div>
        </div>

        <!-- GAME CANVAS -->
        <canvas id="game-canvas"></canvas>

        <!-- WEAPON HUD MODEL -->
        <div class="weapon-view" id="weapon-view"></div>

        <!-- IN-GAME HUD -->
        <div id="hud">
            <div class="hud-top">
                <div style="background: rgba(15, 23, 42, 0.7); padding: 8px 16px; border-radius: 8px; font-size: 15px; border-left: 4px solid #22c55e; border: 1px solid rgba(255,255,255,0.1);">
                    امتیاز: <span id="score">0</span>
                </div>
                <div class="minimap">
                    <div class="player-dot" id="minimap-dot"></div>
                </div>
            </div>

            <div class="crosshair"></div>

            <div class="hud-bottom">
                <!-- Left: Movement Joystick -->
                <div class="joystick-zone interactive" id="joystick">
                    <div class="joystick-knob" id="joystick-knob"></div>
                </div>

                <!-- Right: Fire & Aim Look Zone -->
                <div class="right-control-zone interactive" id="look-zone">
                    <div class="ammo-box">۳۰ / <span style="color: #f59e0b;">۹۰</span></div>
                    <div class="fire-btn" id="fire-btn"><i class="fa-solid fa-crosshairs"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false;
        let gameRunning = false;
        let cameraAngleX = 0;

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-canvas').style.display = 'block';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('weapon-view').style.display = 'block';
            gameRunning = true;
            initThreeJS();
        }

        function initThreeJS() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(30, 50, 30);
            scene.add(dirLight);

            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(150, 150),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Obstacles / Tactical Boxes
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
            for (let i = 0; i < 30; i++) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 4), boxMat);
                box.position.set((Math.random() - 0.5) * 90, 2.5, (Math.random() - 0.5) * 90);
                scene.add(box);
            }

            camera.position.set(0, 2.5, 6);

            function animate() {
                if (!gameRunning) return;
                requestAnimationFrame(animate);

                let speed = 0.12;
                let dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                if (moveForward) camera.position.addScaledVector(dir, speed);
                if (moveBackward) camera.position.addScaledVector(dir, -speed);

                camera.rotation.y = cameraAngleX;

                renderer.render(scene, camera);
            }
            animate();
        }

        // Left Joystick (Movement)
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let joystickActive = false;

        joystick.addEventListener('touchstart', (e) => { joystickActive = true; });
        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            const rect = joystick.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 45;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;

            moveForward = dy < -12;
            moveBackward = dy > 12;
        });
        window.addEventListener('touchend', () => {
            joystickActive = false;
            knob.style.transform = `translate(0px, 0px)`;
            moveForward = moveBackward = false;
        });

        // Right Screen Drag (Camera Look)
        let isLooking = false, lastTouchX = 0;
        const lookZone = document.getElementById('look-zone');

        lookZone.addEventListener('touchstart', (e) => {
            isLooking = true;
            lastTouchX = e.touches[0].clientX;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            let currentX = e.touches[0].clientX;
            let deltaX = currentX - lastTouchX;
            lastTouchX = currentX;

            cameraAngleX -= deltaX * 0.005;
        });

        window.addEventListener('touchend', () => { isLooking = false; });

        // Fire Button action
        document.getElementById('fire-btn').addEventListener('click', () => {
            let scoreElem = document.getElementById('score');
            scoreElem.innerText = parseInt(scoreElem.innerText) + 10;
        });
    </script>
</body>
</html>
