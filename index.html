<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیورا - Nivra SFG Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- لابی اصلی بازی -->
    <div id="lobby-screen" class="screen">
        <div class="top-bar">
            <div class="profile-box" onclick="openProfile()">
                <span id="player-tag">#NEV-7482</span>
            </div>
            <div class="currency-box">
                <span id="player-coins">💰 5000</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" onclick="openFriends()">👥 دوستان</button>
                <button class="icon-btn" onclick="openSettings()">⚙️</button>
            </div>
        </div>

        <div class="center-content">
            <div class="logo-area">
                <h1 class="game-title">NIVRA : SFG 2</h1>
                <p class="game-subtitle">عملیات ویژه تاکتیکی</p>
            </div>

            <div class="menu-buttons">
                <button class="sfg-btn primary" onclick="openTeamSelect()">🎮 شروع بازی آنلاین</button>
                <button class="sfg-btn" onclick="openShop()">🛒 فروشگاه اسلحه و اسکین</button>
            </div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('solo')">تکی (Solo)</button>
            <button class="mode-btn" onclick="setMode('2p')">نبرد ۲ نفره</button>
            <button class="mode-btn" onclick="setMode('4p')">نبرد ۴ نفره</button>
            <button class="mode-btn" onclick="setMode('8p')">نبرد ۸ نفره</button>
        </div>
    </div>

    <!-- صفحه انتخاب تیم -->
    <div id="team-screen" class="screen hidden">
        <h2>انتخاب تیم عملیاتی</h2>
        <div class="team-selection">
            <div class="team-card terrorist" onclick="startGame('T')">
                <h3>تروریست‌ها (Terrorists)</h3>
                <p>لباس سرخ / تهاجمی</p>
            </div>
            <div class="team-card counter" onclick="startGame('CT')">
                <h3>ضدتروریست (CT)</h3>
                <p>لباس آبی / دفاعی</p>
            </div>
        </div>
        <button class="sfg-btn back" onclick="closeTeamSelect()">بازگشت به لابی</button>
    </div>

    <!-- محیط بازی سه‌بعدی -->
    <div id="game-screen" class="screen hidden">
        <div id="canvas-container"></div>
        
        <div class="hud-top">
            <div class="score-board">تیم T: 0 | تیم CT: 0</div>
            <div class="timer">⏱️ 03:00</div>
            <button class="sfg-btn small" onclick="openBuyMenu()">🛒 بای‌منو</button>
            <button class="sfg-btn small red" onclick="exitGame()">خروج</button>
        </div>

        <div class="touch-controls">
            <button class="control-btn" onclick="playerShoot()">💥 شلیک</button>
            <button class="control-btn" onclick="playerJump()">⬆️ پرش</button>
            <button class="control-btn" onclick="playerReload()">🔄 خشاب</button>
        </div>
    </div>

    <!-- مودال فروشگاه -->
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <h2>فروشگاه تجهیزات</h2>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyItem('M4A1 تاکتیکی', 2500)">
                    <h4>اسلحه M4A1 تاکتیکی</h4>
                    <p>قیمت: ۲۵۰۰ 💰</p>
                </div>
                <div class="shop-item" onclick="buyItem('AK-47 آتشین', 2700)">
                    <h4>اسلحه AK-47 آتشین</h4>
                    <p>قیمت: ۲۷۰۰ 💰</p>
                </div>
                <div class="shop-item" onclick="buyItem('اسنایپر AWM', 5000)">
                    <h4>اسنایپر AWM</h4>
                    <p>قیمت: ۵۰۰۰ 💰</p>
                </div>
            </div>
            <button class="sfg-btn" onclick="closeShop()">بستن</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
