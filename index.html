<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivra Online Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- دکمه شروع -->
        <button id="start-btn" onclick="startGame()" style="margin-top: 50%;">شروع بازی</button>
<!-- بخش بازیکنان دور میز - این بخش توسط جاوااسکریپت پر می‌شود -->
<div id="other-players-container" class="other-players"></div>

        <!-- محیط بازی -->
        <div id="game-area" style="display:none;">
            <div id="discard-pile"></div>
            <div class="controls">
                <button id="draw-btn" onclick="drawCard()">کارت کشیدن</button>
            </div>
        </div>

        <!-- دست بازیکن اصلی -->
        <div id="player-hand"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
