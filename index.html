<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیورا - پیام‌رسان و تنظیمات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="no-screenshot">

    <!-- صفحه ورود -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h2>ورود به نیورا</h2>
            <input type="text" id="login-id" placeholder="آیدی کاربری">
            <input type="password" id="login-pass" placeholder="رمز عبور">
            <button id="btn-login">ورود</button>
        </div>
    </div>

    <!-- صفحه اصلی اپلیکیشن -->
    <div id="main-screen" class="screen">
        
        <!-- تب بازی‌ها -->
        <div class="tab-content" id="tab-games">
            <div class="header-bar">بخش بازی‌ها</div>
            <div style="padding: 20px; text-align: center; color: #829ab1;">لیست بازی‌های آنلاین نیورا</div>
        </div>

        <!-- تب پیام‌رسان (PV) -->
        <div class="tab-content active" id="tab-messenger">
            <div class="header-bar">پیام‌رسان (چت خصوصی)</div>
            <div id="pv-list" class="pv-list-container">
                <!-- لیست پی‌وی‌ها اینجا قرار می‌گیرد -->
            </div>
            <!-- دکمه گرد + برای افزودن دوست -->
            <button id="btn-add-pv" class="fab-btn">+</button>
        </div>

        <!-- تب تنظیمات -->
        <div class="tab-content" id="tab-settings">
            <div class="header-bar">تنظیمات و پروفایل</div>
            <div class="settings-body">
                <!-- دکمه گرد پروفایل بالا -->
                <div class="profile-header-center">
                    <div class="profile-circle-pic" id="profile-pic-btn" title="تغییر عکس پروفایل"></div>
                    <input type="file" id="file-input-pic" style="display:none;" accept="image/*">
                    <div id="my-name-display" style="font-weight:bold; font-size:16px; margin-top:5px;">نام کاربر</div>
                    <div id="my-id-display" style="color:#829ab1; font-size:13px;">@id</div>
                </div>
                
                <div class="setting-item">
                    <label>تغییر نام کاربری (فقط یک‌بار رایگان):</label>
                    <input type="text" id="new-username-input" placeholder="نام جدید">
                    <button id="btn-change-username">ثبت تغییر نام</button>
                </div>

                <div class="setting-item">
                    <label>تغییر رمز عبور:</label>
                    <input type="password" id="old-pass-input" placeholder="رمز فعلی">
                    <input type="password" id="new-pass-input" placeholder="رمز جدید">
                    <button id="btn-change-password">تغییر رمز</button>
                </div>

                <div class="setting-item" style="gap:10px;">
                    <label><input type="checkbox" id="toggle-sound" checked> صدای بازی</label>
                    <label><input type="checkbox" id="toggle-invite" checked> امکان دعوت دوستان</label>
                </div>

                <button id="btn-buy-sub" class="sub-btn">خرید اشتراک ویژه</button>
            </div>
        </div>

        <!-- منوی ناوبری پایین -->
        <div class="bottom-nav">
            <div class="nav-item" data-target="tab-games">بازی‌ها</div>
            <div class="nav-item active" data-target="tab-messenger">پیام‌رسان</div>
            <div class="nav-item" data-target="tab-settings">تنظیمات</div>
        </div>
    </div>

    <!-- صفحه چت خصوصی (PV) بازشو -->
    <div id="chat-overlay" class="chat-overlay">
        <div class="room-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <div id="close-chat" style="font-size:22px; cursor:pointer; padding:0 5px;">←</div>
                <div class="item-pic" style="width:35px; height:35px; border-radius:50%; background:#2b5278;"></div>
                <div>
                    <div id="chat-target-name" style="font-weight:bold; font-size:14px;">نام مخاطب</div>
                    <div style="font-size:11px; color:#829ab1;">آنلاین</div>
                </div>
            </div>
        </div>
        <div id="chat-messages-area" class="chat-messages-area">
            <!-- پیام‌ها -->
        </div>
        <div class="room-footer">
            <input type="text" id="pv-chat-input" placeholder="نوشتن پیام...">
            <button id="send-pv-btn">ارسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
