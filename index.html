<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی اونو نیورا - Neura UNO</title>
    <link rel="stylesheet" href="style.css?v=118">
</head>
<body>
    <!-- صفحه ورود و تنظیم اولیه -->
    <div id="setup-screen" class="setup-screen">
        <div class="setup-card">
            <h1>🎮 بازی آنلاین اونو - نیورا</h1>
            <p>نام خود را وارد کنید و وارد میز بازی شوید:</p>
            <input type="text" id="player-name-input" placeholder="نام شما..." value="بازیکن من">
            <button id="start-game-btn" class="neon-btn">ورود به میز بازی</button>
        </div>
    </div>

    <!-- صفحه اصلی بازی -->
    <div id="game-container" class="game-container hidden">
        <!-- هدر بالای صفحه -->
        <header class="game-header">
            <div class="brand">Neura UNO <span class="version">v118</span></div>
            <div class="header-controls">
                <!-- کنترل صدا / میکروفون -->
                <button id="audio-toggle-btn" class="icon-btn" title="قطع/وصل صدا">🔊</button>
                <button id="mic-toggle-btn" class="icon-btn" title="میکروفون">🎤</button>
            </div>
        </header>

        <!-- میز بازی و اطلاعات -->
        <main class="table-section">
            <div id="players-ring" class="players-ring">
                <!-- پروفایل بازیکنان دور میز اینجا قرار می‌گیرد -->
            </div>

            <div class="center-arena">
                <div id="deck-pile" class="card-pile deck-pile" title="برای کشیدن کارت کلیک کنید">
                    <div class="card back">UNO</div>
                    <span class="pile-label">دک (مخزن)</span>
                </div>
                <div id="discard-pile" class="card-pile discard-pile">
                    <!-- آخرین کارت بازی شده -->
                    <span class="pile-label">زمین بازی</span>
                </div>
            </div>

            <div class="turn-indicator">
                نوبت: <span id="current-turn-name">-</span>
            </div>
        </main>

        <!-- پنل پایین: دست بازیکن و چت -->
        <footer class="bottom-panel">
            <div class="player-hand-section">
                <div class="hand-header">
                    <span>کارت‌های شما (<span id="my-card-count">0</span>)</span>
                </div>
                <div id="player-hand" class="player-hand">
                    <!-- کارت‌های دست بازیکن -->
                </div>
            </div>

            <!-- بخش چت اتاق -->
            <div class="room-chat-section">
                <div id="chat-messages" class="chat-messages">
                    <div class="chat-msg system">خوش آمدید! پیام‌ها و ورود/خروج افراد اینجا نمایش داده می‌شود.</div>
                </div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="پیام خود را بنویسید...">
                    <button id="send-chat-btn" class="neon-btn-sm">ارسال</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- پنجره انتخاب رنگ برای کارت Wild -->
    <div id="color-picker-modal" class="modal hidden">
        <div class="modal-content">
            <h3>رنگ مورد نظر را انتخاب کنید:</h3>
            <div class="color-options">
                <button class="color-opt red" data-color="red"></button>
                <button class="color-opt blue" data-color="blue"></button>
                <button class="color-opt green" data-color="green"></button>
                <button class="color-opt yellow" data-color="yellow"></button>
            </div>
        </div>
    </div>

    <script src="script.js?v=118"></script>
</body>
</html>
