<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیورا - Nivra</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- هدر بالای صفحه: پروفایل، تنظیمات و کد دوستان -->
    <div id="top-bar">
        <div id="profile-btn" onclick="openProfile()">
            <span>👤 سرباز نیورا</span>
            <span id="user-tag">#NEV-7482</span>
        </div>
        <div class="top-actions">
            <button onclick="openFriends()" class="icon-btn">👥 دوستان</button>
            <button onclick="openSettings()" class="icon-btn">⚙️</button>
        </div>
    </div>

    <!-- لابی اصلی بازی (استایل کال‌آف‌دیوتی / کانتر) -->
    <div id="lobby-screen">
        <div class="lobby-sidebar">
            <h1 class="game-title">NIVRA</h1>
            <p class="game-subtitle">تاکتیکی آنلاین</p>
            
            <div class="menu-box">
                <button class="menu-btn primary" onclick="startGame(1)">بازی تکی (Solo)</button>
                <button class="menu-btn" onclick="startGame(2)">نبرد ۲ نفره</button>
                <button class="menu-btn" onclick="startGame(4)">نبرد ۴ نفره</button>
                <button class="menu-btn" onclick="startGame(8)">نبرد ۸ نفره</button>
            </div>
        </div>

        <div class="lobby-center">
            <!-- پیش‌نمایش اسلحه و لباس -->
            <div class="loadout-preview">
                <div class="preview-card" onclick="openWeapons()">
                    <h3>اسلحه فعال</h3>
                    <p id="selected-weapon">M4A1 تاکتیکی</p>
                </div>
                <div class="preview-card" onclick="openSkins()">
                    <h3>لباس / اسکین</h3>
                    <p id="selected-skin">استتار شبانه</p>
                </div>
            </div>
        </div>
    </div>

    <!-- محیط بازی و HUD -->
    <div id="game-container" style="display: none;">
        <div id="canvas-container"></div>
        
        <div id="hud">
            <div class="hud-panel">سلامت: <span id="hp-val">100</span> | امتیاز: <span id="score-val">0</span></div>
            <div class="hud-panel" id="minimap">مینی‌مپ</div>
        </div>

        <div id="joystick-container"></div>
        <button id="fire-btn">شلیک</button>
    </div>

    <!-- مدال پروفایل و کد دوستان -->
    <div id="profile-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>پروفایل سرباز</h2>
            <p>کد اختصاصی شما: <strong id="my-tag-code" style="color: #38bdf8;">#NEV-7482</strong></p>
            <label>تغییر نام: <input type="text" id="username-input" value="سرباز نیورا"></label>
            <button onclick="closeProfile()" class="menu-btn">ذخیره</button>
        </div>
    </div>

    <!-- مدال لیست دوستان و افزودن -->
    <div id="friends-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>مدیریت دوستان</h2>
            <div class="add-friend-box">
                <input type="text" id="friend-tag-input" placeholder="وارد کردن کد دوست (مثلاً #NEV-1234)">
                <button onclick="addFriend()" class="menu-btn">افزودن</button>
            </div>
            <div id="friends-list">
                <p style="color: #94a3b8; font-size: 13px;">هنوز دوستی اضافه نشده است.</p>
            </div>
            <button onclick="closeFriends()" class="menu-btn" style="background: #475569;">بستن</button>
        </div>
    </div>

    <!-- مدال انتخاب اسلحه -->
    <div id="weapons-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>انتخاب اسلحه</h2>
            <div class="selection-grid">
                <button class="sel-item active" onclick="selectWeapon('M4A1 تاکتیکی')">M4A1 تاکتیکی</button>
                <button class="sel-item" onclick="selectWeapon('AK-47 آتشین')">AK-47 آتشین</button>
                <button class="sel-item" onclick="selectWeapon('اسنایپر AWM')">اسنایپر AWM</button>
            </div>
            <button onclick="closeWeapons()" class="menu-btn">تایید</button>
        </div>
    </div>

    <!-- مدال انتخاب لباس -->
    <div id="skins-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>انتخاب لباس و اسکین</h2>
            <div class="selection-grid">
                <button class="sel-item active" onclick="selectSkin('استتار شبانه')">استتار شبانه</button>
                <button class="sel-item" onclick="selectSkin('پوشش بیابانی')">پوشش بیابانی</button>
                <button class="sel-item" onclick="selectSkin('لباس ویژه سایبر')">لباس ویژه سایبر</button>
            </div>
            <button onclick="closeSkins()" class="menu-btn">تایید</button>
        </div>
    </div>

    <!-- مدال تنظیمات -->
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>تنظیمات</h2>
            <label>صدا: <input type="range" min="0" max="100" value="80"></label>
            <button onclick="closeSettings()" class="menu-btn">بازگشت</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
