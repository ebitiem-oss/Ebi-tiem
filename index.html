<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVRA TEST</title>
    <!-- دقت کن نام دقیقاً style.css باشد -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1 class="logo">NIVRA</h1>
            <div class="input-group">
                <input type="text" id="login-id" placeholder="آیدی">
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" placeholder="رمز عبور (۸ کاراکتر)">
            </div>
            <button id="btn-login" class="main-btn">ورود</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="header"><span class="app-title">منوی اصلی</span></div>
        <div id="tab-games" class="tab-content active">
            <div id="room-list" class="room-list-container"></div>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active" data-target="tab-games"><span>🎮</span><span>بازی</span></div>
            <div class="nav-item" data-target="tab-messenger"><span>💬</span><span>چت</span></div>
            <div class="nav-item" data-target="tab-settings"><span>⚙️</span><span>تنظیمات</span></div>
        </div>
    </div>

    <!-- دقت کن نام دقیقاً script.js باشد -->
    <script src="script.js"></script>
</body>
</html>
