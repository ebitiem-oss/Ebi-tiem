<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیورا - بازی آنلاین اونو</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Layout */
        .app-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding-bottom: 70px; }
        .view.active { display: flex; }
        
        /* Bottom Navigation */
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        /* Common Elements */
        .header { background: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
        .btn { background: var(--accent-color); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .input { background: #090d16; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 8px; width: 100%; outline: none; margin-top: 6px; }

        /* Rooms List (Telegram PV style) */
        .room-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); gap: 12px; cursor: pointer; background: rgba(255,255,255,0.01); }
        .room-avatar { width: 50px; height: 50px; border-radius: 50%; background: #334155; object-fit: cover; }
        .room-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .room-host { font-weight: bold; font-size: 15px; }
        .seats-indicator { display: flex; gap: 3px; align-items: center; margin-top: 4px; }
        .seat-dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
        .seat-dot.filled { background: var(--success); }

        /* Room Inside View */
        #room-view { background: var(--bg-color); position: absolute; inset: 0; z-index: 200; display: none; flex-direction: column; }
        #room-view.active { display: flex; }
        .seats-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .seat-row { background: var(--card-bg); padding: 10px 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-color); }
        .seat-user-info { display: flex; align-items: center; gap: 10px; }
        .seat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #475569; object-fit: cover; }
        .user-meta { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-level { font-size: 11px; color: var(--accent-color); }
        .host-badge { background: #38bdf822; color: var(--accent-color); font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-top: 2px; width: fit-content; }
        
        /* Interactive Tick / Ready */
        .ready-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ready-check.checked { background: var(--success); border-color: var(--success); color: #fff; }

        /* Bottom Chat & Mic in Room */
        .room-footer { padding: 10px 16px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        .room-footer input { flex: 1; margin: 0; }
        .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; }
        
        /* Toast */
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #334155; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 1000; display: none; }
    </style>
</head>
<body>

<div id="toast">پیام</div>

<div class="app-container">
    <!-- View 1: Games / Rooms List -->
    <div id="games-view" class="view active">
        <div class="header">اتاق‌های بازی اونو</div>
        <div id="rooms-list">
            <!-- Dynamic Rooms -->
        </div>
    </div>

    <!-- View 2: Messenger -->
    <div id="messenger-view" class="view">
        <div class="header">پیام‌رسان (چت خصوصی)</div>
        <div style="padding: 20px; text-align: center; color: var(--text-muted);">پیامی وجود ندارد</div>
    </div>

    <!-- View 3: Settings & Profile -->
    <div id="settings-view" class="view">
        <div class="header">تنظیمات و پروفایل</div>
        <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 16px;">
                <label for="avatar-input" style="cursor: pointer; position: relative;">
                    <img id="profile-avatar" src="" style="width: 70px; height: 70px; border-radius: 50%; background: #334155; object-fit: cover;" alt="پروفایل">
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="updateAvatar(event)">
                </label>
                <div>
                    <input type="text" id="username-input" class="input" placeholder="آیدی شما">
                    <button class="btn" style="margin-top: 8px; padding: 6px 12px; font-size: 12px;" onclick="saveUsername()">ذخیره آیدی (فقط یک‌بار)</button>
                </div>
            </div>
            <hr style="border-color: var(--border-color);">
            <div>
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>صداهای بازی</span>
                    <input type="checkbox" checked style="width: 18px; height: 18px;">
                </label>
            </div>
            <div>
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>دعوت به بازی</span>
                    <input type="checkbox" checked style="width: 18px; height: 18px;">
                </label>
            </div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 20px;">
                پشتیبانی: 09991990035
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('games-view', this)">
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8zM6 15h2v-2h2v-2H8V9H6v2H4v2h2z"/></svg>
            بازی‌ها
        </button>
        <button class="nav-item" onclick="switchView('messenger-view', this)">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2z"/></svg>
            پیام‌رسان
        </button>
        <button class="nav-item" onclick="switchView('settings-view', this)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            تنظیمات
        </button>
    </nav>
</div>

<!-- Room Inside View (Full Overlay) -->
<div id="room-view">
    <div class="header">
        <span id="room-header-title">اتاق بازی</span>
        <button class="icon-btn" onclick="leaveRoom()">➔</button>
    </div>
    <div class="seats-list" id="seats-container">
        <!-- 10 Seats Rendered Here -->
    </div>
    <div class="room-footer">
        <button class="icon-btn">🎤</button>
        <input type="text" class="input" placeholder="پیام در اتاق...">
        <button class="btn" style="padding: 8px 12px;">ارسال</button>
    </div>
</div>

<script>
    // Mock Data for Rooms
    const rooms = [
        { id: 1, host: 'علی‌رضا', avatar: '', playersCount: 4 },
        { id: 2, host: 'سارا', avatar: '', playersCount: 7 },
        { id: 3, host: 'محمد', avatar: '', playersCount: 2 },
        { id: 4, host: 'نیلوفر', avatar: '', playersCount: 10 },
        { id: 5, host: 'رضا', avatar: '', playersCount: 5 }
    ];

    function renderRooms() {
        const container = document.getElementById('rooms-list');
        container.innerHTML = '';
        rooms.forEach(room => {
            let dots = '';
            for(let i=0; i<10; i++) {
                dots += `<div class="seat-dot ${i < room.playersCount ? 'filled' : ''}"></div>`;
            }
            container.innerHTML += `
                <div class="room-row" onclick="joinRoom('${room.host}')">
                    <div class="room-avatar"></div>
                    <div class="room-info">
                        <div class="room-host">${room.host}</div>
                        <div class="seats-indicator">${dots}</div>
                    </div>
                </div>
            `;
        });
    }

    function joinRoom(hostName) {
        document.getElementById('room-header-title').innerText = `اتاق ${hostName}`;
        const seatsContainer = document.getElementById('seats-container');
        seatsContainer.innerHTML = '';
        
        for(let i = 1; i <= 10; i++) {
            let isHost = (i === 1);
            seatsContainer.innerHTML += `
                <div class="seat-row">
                    <div class="seat-user-info">
                        <div class="seat-avatar"></div>
                        <div class="user-meta">
                            <span class="user-name">${isHost ? hostName : (i <= 4 ? 'بازیکن ' + i : 'صندلی خالی')}</span>
                            <span class="user-level">لول ${i * 5}</span>
                            ${isHost ? '<span class="host-badge">میزبان</span>' : ''}
                        </div>
                    </div>
                    <div class="ready-check" onclick="toggleReady(this)">✓</div>
                </div>
            `;
        }
        document.getElementById('room-view').classList.add('active');
    }

    function leaveRoom() {
        document.getElementById('room-view').classList.remove('active');
    }

    function toggleReady(el) {
        el.classList.toggle('checked');
    }

    function switchView(viewId, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2000);
    }

    // Username change restriction logic
    let usernameChanged = localStorage.getItem('usernameChanged') === 'true';
    function saveUsername() {
        if(usernameChanged) {
            showToast('تغییر آیدی فقط یک‌بار مجاز است! نیاز به اشتراک.');
            return;
        }
        const val = document.getElementById('username-input').value;
        if(val) {
            localStorage.setItem('usernameChanged', 'true');
            usernameChanged = true;
            showToast('آیدی ذخیره شد.');
        }
    }

    function updateAvatar(event) {
        const reader = new FileReader();
        reader.onload = function() {
            document.getElementById('profile-avatar').src = reader.result;
            showToast('تصویر پروفایل به‌روز شد.');
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    renderRooms();
</script>
</body>
</html>
