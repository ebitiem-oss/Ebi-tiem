<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیورا - Nivra CS Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Tahoma, sans-serif; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* منوی اصلی / لابی */
        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 20, 0.92); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff;
        }
        .menu-box {
            background: rgba(30, 30, 45, 0.9); border: 2px solid #ffcc00;
            padding: 20px 40px; border-radius: 12px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        .menu-box h1 { font-size: 28px; margin-bottom: 15px; color: #ffcc00; letter-spacing: 2px; }
        .btn {
            background: linear-gradient(to bottom, #ffaa00, #cc8800); color: #000;
            font-weight: bold; border: none; padding: 12px 30px; font-size: 16px;
            border-radius: 6px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }

        /* رابط کاربری داخل بازی (HUD) */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }
        .hud-top-bar {
            position: absolute; top: 10px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            color: #fff; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000;
        }
        .hud-stat { background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 6px; border: 1px solid #444; }

        /* جوی‌استیک حرکت (چپ) */
        #joystick-base {
            position: absolute; bottom: 30px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; pointer-events: auto; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255, 204, 0, 0.7); border-radius: 50%;
            pointer-events: none; transition: transform 0.05s linear;
        }

        /* کنترل دوربین و شلیک (راست) */
        #aim-zone {
            position: absolute; bottom: 0; right: 0; width: 50%; height: 100%;
            pointer-events: auto; touch-action: none;
        }
        #fire-btn {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
            background: rgba(220, 50, 50, 0.7); border: 3px solid #ff9999;
            border-radius: 50%; pointer-events: auto; display: flex;
            justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 14px;
            box-shadow: 0 0 10px rgba(220, 50, 50, 0.8);
        }

        /* مینی‌مپ (بالای راست) */
        #minimap {
            position: absolute; top: 60px; right: 20px; width: 100px; height: 100px;
            background: rgba(0, 0, 0, 0.6); border: 2px solid #ffcc00; border-radius: 50%;
            overflow: pointer; pointer-events: auto;
        }
        #minimap-player {
            position: absolute; top: 46px; left: 46px; width: 8px; height: 8px;
            background: #00ff00; border-radius: 50%;
        }

        /* نشانه‌گر وسط صفحه */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
    </style>
    <!-- بارگذاری Three.js از CDN معتبر -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- منوی ورود به بازی -->
    <div id="menu-overlay">
        <div class="menu-box">
            <h1>نیورا | NIVRA</h1>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 14px;">سبک کانتر استریک - آنلاین سه‌بعدی</p>
            <button class="btn" onclick="startGame()">شروع بازی</button>
        </div>
    </div>

    <!-- محیط سه‌بعدی بازی -->
    <div id="canvas-container"></div>

    <!-- رابط کاربری درون بازی -->
    <div id="hud">
        <div class="hud-top-bar">
            <div class="hud-stat">امتیاز: <span id="score-val">0</span></div>
            <div class="hud-stat">سلامتی: 100%</div>
        </div>

        <div id="minimap">
            <div id="minimap-player"></div>
        </div>

        <div id="crosshair"></div>

        <!-- جوی‌استیک حرکت -->
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>

        <!-- دکمه شلیک -->
        <div id="fire-btn">شلیک</div>
    </div>

    <div id="aim-zone"></div>

    <script>
        let scene, camera, renderer, player;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let cameraAngleY = 0;
        let isGameStarted = false;

        function startGame() {
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            isGameStarted = true;
            initThreeJS();
        }

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // آسمان روز

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // نورپردازی محیط
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // زمین بازی
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x557a46 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // چند مانع (جعبه) در محیط برای جذابیت
            const boxGeo = new THREE.BoxGeometry(6, 6, 6);
            const boxMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            for (let i = 0; i < 15; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random() - 0.5) * 120, 3, (Math.random() - 0.5) * 120);
                scene.add(box);
            }

            // موقعیت اولیه بازیکن
            camera.position.set(0, 3, 10);

            // کنترل لمسی جوی‌استیک حرکت
            setupJoystick();
            // کنترل چرخش دوربین با لمس سمت راست
            setupAimZone();

            animate();
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const knob = document.getElementById('joystick-knob');
            let maxDist = 35;

            base.addEventListener('touchmove', (e) => {
                const touch = e.targetTouches[0];
                const rect = base.getBoundingClientRect();
                let x = touch.clientX - (rect.left + rect.width / 2);
                let y = touch.clientY - (rect.top + rect.height / 2);
                
                let dist = Math.sqrt(x * x + y * y);
                if (dist > maxDist) {
                    x = (x / dist) * maxDist;
                    y = (y / dist) * maxDist;
                }
                knob.style.transform = `translate(${x}px, ${y}px)`;

                moveForward = y < -10;
                moveBackward = y > 10;
                moveLeft = x < -10;
                moveRight = x > 10;
            });

            base.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                moveForward = false;
                moveBackward = false;
                moveLeft = false;
                moveRight = false;
            });
        }

        function setupAimZone() {
            const aimZone = document.getElementById('aim-zone');
            let lastX = 0;

            aimZone.addEventListener('touchstart', (e) => {
                lastX = e.touches[0].clientX;
            });

            aimZone.addEventListener('touchmove', (e) => {
                let currentX = e.touches[0].clientX;
                let deltaX = currentX - lastX;
                cameraAngleY -= deltaX * 0.005;
                lastX = currentX;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGameStarted) {
                let speed = 0.15;
                let dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                let sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

                if (moveForward) camera.position.addScaledVector(dir, speed);
                if (moveBackward) camera.position.addScaledVector(dir, -speed);
                if (moveLeft) camera.position.addScaledVector(sideDir, speed);
                if (moveRight) camera.position.addScaledVector(sideDir, -speed);

                camera.rotation.y = cameraAngleY;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
