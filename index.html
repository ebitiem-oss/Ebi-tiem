<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیورا - Nivra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- صفحه ورود -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1 class="logo">NIVRA</h1>
            <div class="input-group">
                <input type="text" id="login-id" placeholder="آیدی خود را وارد کنید">
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" placeholder="رمز عبور (حداقل ۸ کاراکتر)">
            </div>
            <button id="btn-login" class="main-btn">ورود به بازی</button>
            <div id="forgot-pass" class="forgot-link">فراموشی رمز عبور؟</div>
        </div>
    </div>

    <!-- منوی اصلی و ساختار برنامک -->
    <div id="main-screen" class="screen">
        <div class="header">
            <span class="app-title" id="header-title">بازی‌های اونو</span>
        </div>

        <!-- بخش ۱: بازی‌ها (لیست اتاق‌ها و لابی) -->
        <div id="tab-games" class="tab-content active">
            <div class="room-list-container" id="room-list">
                <!-- اتاق‌ها به صورت پویا بارگذاری می‌شوند -->
            </div>
        </div>

        <!-- بخش ۲: پیام‌رسان (چت خصوصی PV) -->
        <div id="tab-messenger" class="tab-content">
            <div class="chat-placeholder">
                <p>بخش پیام‌رسان (چت خصوصی)</p>
            </div>
        </div>

        <!-- بخش ۳: تنظیمات و پروفایل -->
        <div id="tab-settings" class="tab-content">
            <div class="settings-container">
                <div class="profile-section">
                    <div class="profile-pic-wrapper">
                        <img id="user-avatar" src="https://via.placeholder.com/80" alt="پروفایل">
                    </div>
                    <h3 id="display-username">کاربر</h3>
                    <p id="subscription-msg" class="sub-text" style="display:none;">آیدی شما قبلاً تغییر کرده است</p>
                    <button id="btn-change-profile" class="secondary-btn">تغییر آیدی پروفایل</button>
                    <button id="btn-buy-sub" class="sub-btn" style="display:none;">خرید اشتراک ویژه</button>
                </div>

                <div class="settings-list">
                    <div class="setting-item">
                        <span>صدای بازی</span>
                        <input type="checkbox" id="sound-toggle" checked>
                    </div>
                    <div class="setting-item">
                        <span>درخواست‌های دعوت</span>
                        <input type="checkbox" id="invite-toggle" checked>
                    </div>
                </div>

                <!-- پنل اختصاصی سازنده -->
                <div id="admin-panel" class="admin-section" style="display:none;">
                    <h4>پنل مدیریت سازنده (ebitiem)</h4>
                    <input type="text" id="admin-target-id" placeholder="آیدی کاربر جهت ریست رمز">
                    <button id="btn-reset-user-pass" class="admin-btn">ریست رمز عبور کاربر</button>
                </div>
            </div>
        </div>

        <!-- نویگیشن پایین صفحه (ترتیب دقیق) -->
        <div class="bottom-nav">
            <div class="nav-item active" data-target="tab-games">
                <span>🎮</span>
                <span>بازی‌ها</span>
            </div>
            <div class="nav-item" data-target="tab-messenger">
                <span>💬</span>
                <span>پیام‌رسان</span>
            </div>
            <div class="nav-item" data-target="tab-settings">
                <span>⚙️</span>
                <span>تنظیمات</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
