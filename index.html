<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Nivra - Step 3</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; font-family: sans-serif; }
        canvas { display: block; }
        
        /* جوی‌استیک حرکت در سمت چپ */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            z-index: 100;
        }

        /* ناحیه کنترل دوربین در سمت راست */
        #touch-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 90;
        }

        /* دکمه شلیک در سمت راست */
        #fire-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.6);
            border: 3px solid white;
            border-radius: 50%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        /* نشانه‌گر وسط صفحه (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 24px;
            z-index: 80;
            pointer-events: none;
        }

        /* پنل HUD (خون، تیر، امتیاز) بالای صفحه و پایین */
        #hud-top {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            font-size: 18px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #hud-bottom-right {
            position: absolute;
            bottom: 30px;
            right: 140px;
            color: white;
            font-weight: bold;
            font-size: 22px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* هشدار چرخش گوشی */
        #orientation-warning {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 9999;
            color: white; text-align: center; justify-content: center; align-items: center;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning { display: flex; flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div style="font-size: 50px;">🔄</div>
        <p>لطفاً گوشی را افقی کنید</p>
    </div>

    <!-- HUD عناصر بازی -->
    <div id="hud-top">
        <div>❤️ HP: <span id="hp-val">100</span></div>
        <div>🏆 NIVRA CS</div>
        <div>💰 $800</div>
    </div>
    <div id="hud-bottom-right">
        30 / <span id="ammo-val">90</span>
    </div>

    <div id="joystick-container"></div>
    <div id="touch-look-zone"></div>
    <div id="fire-btn">شلیک</div>
    <div id="crosshair">+</div>

    <!-- کتابخانه‌ها -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script>
        // ۱. تنظیمات صحنه و دوربین
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ۲. نورپردازی
        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
        scene.add(light);

        // ۳. زمین و موانع
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for (let i = 0; i < 15; i++) {
            const boxGeo = new THREE.BoxGeometry(2, 4, 2);
            const boxMat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set((Math.random() - 0.5) * 40, 2, (Math.random() - 0.5) * 40);
            scene.add(box);
        }

        // ۴. ایجاد گروه بازیکن و دوربین اول شخص
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        camera.position.set(0, 1.8, 0);
        playerGroup.add(camera);

        // اضافه کردن اسلحه به دوربین (دید اول شخص)
        const gunGroup = new THREE.Group();
        // بدنه اصلی اسلحه
        const gunBodyGeo = new THREE.BoxGeometry(0.15, 0.15, 0.8);
        const gunMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const gunBody = new THREE.Mesh(gunBodyGeo, gunMat);
        gunBody.position.set(0.3, -0.25, -0.5);
        gunGroup.add(gunBody);

        // لوله اسلحه
        const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.4);
        const barrelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0.3, -0.23, -0.85);
        gunGroup.add(barrel);

        camera.add(gunGroup);

        let pitch = 0;
        let yaw = 0;

        // ۵. جوی‌استیک حرکت
        let moveForward = 0;
        let moveRight = 0;

        const joystick = nipplejs.create({
            zone: document.getElementById('joystick-container'),
            mode: 'static',
            position: { left: '70px', bottom: '70px' },
            color: 'white'
        });

        joystick.on('move', (evt, data) => {
            moveForward = data.vector.y;
            moveRight = data.vector.x;
        });

        joystick.on('end', () => {
            moveForward = 0;
            moveRight = 0;
        });

        // ۶. کنترل نگاه با لمس صفحه
        const lookZone = document.getElementById('touch-look-zone');
        let isTouchingLook = false;
        let lastTouchX = 0;
        let lastTouchY = 0;

        lookZone.addEventListener('touchstart', (e) => {
            isTouchingLook = true;
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        });

        lookZone.addEventListener('touchmove', (e) => {
            if (!isTouchingLook) return;
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;

            const deltaX = currentX - lastTouchX;
            const deltaY = currentY - lastTouchY;

            yaw -= deltaX * 0.003;
            pitch -= deltaY * 0.003;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            lastTouchX = currentX;
            lastTouchY = currentY;
        });

        lookZone.addEventListener('touchend', () => {
            isTouchingLook = false;
        });

        // شلیک و کم شدن تعداد تیر
        let ammo = 30;
        document.getElementById('fire-btn').addEventListener('touchstart', () => {
            if (ammo > 0) {
                ammo--;
                document.getElementById('ammo-val').textContent = ammo * 3; // عدد خشاب کلی
                // لگد کوچک اسلحه هنگام شلیک
                gunGroup.position.z += 0.05;
                setTimeout(() => { gunGroup.position.z -= 0.05; }, 50);
            }
            document.getElementById('crosshair').style.color = 'red';
            setTimeout(() => {
                document.getElementById('crosshair').style.color = 'rgba(255, 255, 255, 0.7)';
            }, 100);
        });

        // ۷. حلقه اصلی بازی
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.15;
            playerGroup.translateZ(-moveForward * speed);
            playerGroup.translateX(moveRight * speed);

            playerGroup.rotation.y = yaw;
            camera.rotation.x = pitch;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
