<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ebi-tiem UNO</title>
    <link rel="stylesheet" href="style.css?v=117">
</head>
<body>

    <!-- صفحه تنظیمات و شروع بازی -->
    <div id="setup-screen">
        <div id="setup-box">
            <h2>تنظیمات بازی اونو</h2>
            <div style="margin-bottom: 10px; text-align: right;">
                <label style="font-size: 12px;">نام شما:</label>
                <input type="text" id="player-name-input" value="You" autocomplete="off">
            </div>
            <div style="margin-bottom: 15px; text-align: right;">
                <label style="font-size: 12px;">تعداد کل بازیکنان (تا ۱۰ نفر):</label>
                <select id="player-count-select">
                    <option value="2">۲ بازیکن (۱ ربات)</option>
                    <option value="3">۳ بازیکن (۲ ربات)</option>
                    <option value="4" selected>۴ بازیکن (۳ ربات)</option>
                    <option value="5">۵ بازیکن (۴ ربات)</option>
                    <option value="6">۶ بازیکن (۵ ربات)</option>
                    <option value="7">۷ بازیکن (۶ ربات)</option>
                    <option value="8">۸ بازیکن (۷ ربات)</option>
                    <option value="9">۹ بازیکن (۸ ربات)</option>
                    <option value="10">۱۰ بازیکن (۹ ربات)</option>
                </select>
            </div>
            <button onclick="initGameFromSetup()" style="width: 100%; background: var(--neon-green); border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; color: #000;">شروع بازی</button>
        </div>
    </div>

    <div id="top-bar">
        <div id="players-area"></div>
    </div>

    <div id="game-table">
        <div id="deck-container">
            <div class="card deck-card" onclick="drawCard()">DECK</div>
        </div>
        <div id="discard-pile-container"></div>
    </div>

    <!-- بخش چت تعاملی -->
    <div id="chat-voice-bar">
        <div id="chat-messages" onclick="openChatModal()">به بازی اونو خوش آمدید! (برای چت کلیک کنید)</div>
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>

    <!-- مودال ارسال پیام -->
    <div id="chat-modal" style="display:none;">
        <div id="chat-modal-content">
            <div id="chat-history"></div>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <input type="text" id="chat-input" placeholder="پیام خود را بنویسید..." autocomplete="off">
                <button onclick="sendChatMessage()" style="background: var(--neon-green); border: none; padding: 5px 10px; font-weight: bold; cursor: pointer;">ارسال</button>
                <button onclick="closeChatModal()" style="background: #444; color: white; border: none; padding: 5px 10px; cursor: pointer;">بستن</button>
            </div>
        </div>
    </div>

    <!-- مودال انتخاب رنگ Wild -->
    <div id="color-picker-modal" style="display:none;">
        <div id="color-picker-content">
            <h3>انتخاب رنگ بعدی</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <button onclick="selectWildColor('red')" style="background: #e74c3c; height: 40px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">قرمز</button>
                <button onclick="selectWildColor('blue')" style="background: #3498db; height: 40px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">آبی</button>
                <button onclick="selectWildColor('green')" style="background: #2ecc71; height: 40px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">سبز</button>
                <button onclick="selectWildColor('yellow')" style="background: #f1c40f; height: 40px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: black;">زرد</button>
            </div>
        </div>
    </div>

    <div id="player-hand-container">
        <div id="player-hand"></div>
    </div>

    <script src="script.js?v=117"></script>
</body>
    </html>
