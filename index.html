<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیورا - بازی اونو</title>
    <style>
        :root {
            --tg-blue: #229ed9;
            --tg-dark-blue: #17212b;
            --tg-bg: #0e1621;
            --tg-item-bg: #182533;
            --tg-border: #232e3c;
            --text-main: #f5f5f5;
            --text-secondary: #879097;
            --green: #2ecc71;
            --red: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: var(--tg-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Bottom Nav */
        .bottom-nav { height: 60px; background: var(--tg-dark-blue); display: flex; border-top: 1px solid var(--tg-border); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--tg-blue); }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        /* Views */
        .view { display: none; flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .view.active { display: flex; flex-direction: column; }

        /* Header */
        .header { background: var(--tg-dark-blue); padding: 15px; text-align: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid var(--tg-border); }

        /* Telegram PV Style Lists */
        .pv-list { display: flex; flex-direction: column; }
        .pv-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--tg-border); background: var(--tg-bg); cursor: pointer; }
        .pv-item:active { background: var(--tg-item-bg); }
        .pv-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--tg-blue); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; overflow: hidden; position: relative; flex-shrink: 0; }
        .pv-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .pv-info { flex: 1; margin-right: 12px; }
        .pv-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .pv-subtitle { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 3px; }
        
        /* Seat mini icons */
        .seat-icons { display: flex; gap: 2px; margin-top: 4px; }
        .mini-dot { width: 8px; height: 8px; border-radius: 50%; background: #4e5d6c; }
        .mini-dot.filled { background: var(--green); }

        /* Settings View */
        .settings-container { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .profile-upload-box { width: 90px; height: 90px; border-radius: 50%; background: var(--tg-item-bg); border: 2px dashed var(--tg-blue); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
        .profile-upload-box img { width: 100%; height: 100%; object-fit: cover; }
        .input-group { width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 13px; color: var(--text-secondary); }
        .input-group input { padding: 12px; border-radius: 8px; background: var(--tg-item-bg); border: 1px solid var(--tg-border); color: #fff; font-size: 14px; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; background: var(--tg-blue); color: #fff; border: none; font-weight: bold; cursor: pointer; text-align: center; }

        /* Room Interior */
        .room-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: var(--tg-dark-blue); border-bottom: 1px solid var(--tg-border); }
        .room-seats-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .seat-row { display: flex; align-items: center; background: var(--tg-item-bg); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--tg-border); }
        .seat-row.empty { border: 1px dashed var(--text-secondary); background: transparent; justify-content: center; color: var(--text-secondary); cursor: pointer; }
        .ready-badge { width: 24px; height: 24px; border-radius: 50%; background: var(--tg-border); display: flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; margin-right: auto; }
        .ready-badge.is-ready { background: var(--green); color: #fff; }

        /* Room Bottom Bar */
        .room-bottom-controls { background: var(--tg-dark-blue); padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--tg-border); }
        .action-buttons { display: flex; gap: 10px; }
        .chat-input-bar { display: flex; gap: 8px; align-items: center; }
        .chat-input-bar input { flex: 1; padding: 10px; border-radius: 20px; background: var(--tg-bg); border: 1px solid var(--tg-border); color: #fff; font-size: 13px; }
        .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--tg-item-bg); border: 1px solid var(--tg-border); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }

        /* Modals & Menus */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal.active { display: flex; }
        .modal-content { background: var(--tg-dark-blue); width: 85%; max-width: 320px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--tg-border); }
    </style>
</head>
<body>

    <!-- Views Container -->
    <!-- 1. Games View (Lobby) -->
    <div id="games-view" class="view active">
        <div class="header">لیست اتاق‌های بازی اونو</div>
        <div class="pv-list" id="rooms-list-container">
            <!-- Rooms rendered by JS -->
        </div>
    </div>

    <!-- 2. Messenger View (PV) -->
    <div id="messenger-view" class="view">
        <div class="header">پیام‌رسان (چت خصوصی)</div>
        <div class="pv-list">
            <div class="pv-item" onclick="openPV('علی رضایی')">
                <div class="pv-avatar">ع</div>
                <div class="pv-info">
                    <div class="pv-title">علی رضایی</div>
                    <div class="pv-subtitle">سلام، پای بازی اونو هستی؟</div>
                </div>
            </div>
            <div class="pv-item" onclick="openPV('سارا مهدوی')">
                <div class="pv-avatar">س</div>
                <div class="pv-info">
                    <div class="pv-title">سارا مهدوی</div>
                    <div class="pv-subtitle">دعوت‌نامه فرستادم برات</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Settings View -->
    <div id="settings-view" class="view">
        <div class="header">تنظیمات پروفایل</div>
        <div class="settings-container">
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <div class="profile-upload-box" onclick="document.getElementById('avatar-file-input').click()">
                <span id="avatar-placeholder">📷</span>
                <img id="avatar-preview" style="display: none;" alt="Profile">
            </div>
            <div class="input-group">
                <label>نام کاربری (فقط یک‌بار قابل تغییر)</label>
                <input type="text" id="username-input" value="کاربر نیورا">
            </div>
            <button class="btn" onclick="saveProfile()">ذخیره تغییرات</button>
            <button class="btn" style="background: #232e3c; color: var(--tg-blue);" onclick="alert('بخش اشتراک به زودی فعال می‌شود')">خرید اشتراک ویژه</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('games', this)">
            <span>🎮</span>بازی‌ها
        </div>
        <div class="nav-item" onclick="switchTab('messenger', this)">
            <span>💬</span>پیام‌رسان
        </div>
        <div class="nav-item" onclick="switchTab('settings', this)">
            <span>⚙️</span>تنظیمات
        </div>
    </div>

    <!-- Room Interior Screen -->
    <div id="room-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--tg-bg); z-index: 150; flex-direction: column;">
        <div class="room-header">
            <span id="room-title-display" style="font-weight: bold;">اتاق بازی</span>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span onclick="closeRoom()" style="cursor: pointer; font-size: 18px;">❌ خروج</span>
                <span onclick="toggleRoomMenu()" style="cursor: pointer; font-size: 20px;">⋮</span>
            </div>
        </div>

        <!-- Seats List 1 to 10 Vertical -->
        <div class="room-seats-list" id="seats-container">
            <!-- Rendered via JS -->
        </div>

        <!-- Bottom Controls inside Room -->
        <div class="room-bottom-controls">
            <div class="action-buttons">
                <button class="btn" id="ready-btn" onclick="toggleReady()" style="background: var(--green);">آمادگی (تیک)</button>
                <button class="btn" id="standup-btn" onclick="standUp()" style="background: var(--red);">برخاستن</button>
            </div>
            <div class="chat-input-bar">
                <div class="icon-btn" onclick="toggleMic()">🎤</div>
                <input type="text" placeholder="پیام خود را بنویسید...">
                <div class="icon-btn" onclick="sendRoomMsg()">🛩️</div>
            </div>
        </div>
    </div>

    <!-- 3-Dot Menu Modal inside Room -->
    <div class="modal" id="room-menu-modal" onclick="if(event.target===this) toggleRoomMenu()">
        <div class="modal-content">
            <h3 style="font-size: 15px; margin-bottom: 5px;">منوی اتاق</h3>
            <button class="btn" onclick="openInviteModal()">دعوت به دوستان</button>
            <button class="btn" style="background: var(--tg-item-bg); color: var(--text-main);" onclick="toggleRoomMenu()">بستن</button>
        </div>
    </div>

    <!-- Invite Friends Modal -->
    <div class="modal" id="invite-modal">
        <div class="modal-content">
            <h3 style="font-size: 15px;">انتخاب دوست برای دعوت</h3>
            <div class="pv-item" onclick="sendInvite('علی رضایی')" style="padding: 8px 0; border: none;">
                <div class="pv-avatar" style="width: 40px; height: 40px; font-size: 16px;">ع</div>
                <div class="pv-info"><div class="pv-title" style="font-size: 14px;">علی رضایی</div></div>
            </div>
            <button class="btn" style="background: var(--tg-item-bg); color: var(--text-main);" onclick="document.getElementById('invite-modal').classList.remove('active')">انصراف</button>
        </div>
    </div>

    <script>
        // Data & State
        let currentTab = 'games';
        let inRoom = false;
        let isReadyState = false;
        let mySeatIndex = null;

        // Mock Rooms Data with 10 slots
        const rooms = [
            { id: 1, name: 'اتاق حرفه‌ای‌های اونو', host: 'سارا مهدوی', max: 10, seats: [ {name:'سارا مهدوی', ready:true}, {name:'رضا', ready:false}, null, null, null, null, null, null, null, null ] },
            { id: 2, name: 'دورهمی دوستانه', host: 'امیر', max: 10, seats: [ {name:'امیر', ready:true}, null, null, null, null, null, null, null, null, null ] },
            { id: 3, name: 'اتاق سریع', host: 'مینا', max: 10, seats: [ {name:'مینا', ready:false}, {name:'علی', ready:true}, {name:'سحر', ready:true}, null, null, null, null, null, null, null ] }
        ];

        function switchTab(tabId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId + '-view').classList.add('active');
            el.classList.add('active');
        }

        function renderRooms() {
            const container = document.getElementById('rooms-list-container');
            container.innerHTML = '';
            rooms.forEach(room => {
                let filledCount = room.seats.filter(s => s !== null).length;
                let dotsHtml = '';
                for(let i=0; i<10; i++) {
                    let isFilled = i < filledCount;
                    dotsHtml += `<div class="mini-dot ${isFilled ? 'filled' : ''}"></div>`;
                }

                let div = document.createElement('div');
                div.className = 'pv-item';
                div.onclick = () => joinRoom(room);
                div.innerHTML = `
                    <div class="pv-avatar">🎮</div>
                    <div class="pv-info">
                        <div class="pv-title">${room.name}</div>
                        <div class="pv-subtitle">میزبان: ${room.host}</div>
                        <div class="seat-icons">${dotsHtml}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        let activeRoom = null;
        function joinRoom(room) {
            activeRoom = room;
            document.getElementById('room-title-display').innerText = room.name;
            document.getElementById('room-screen').style.display = 'flex';
            renderSeats();
        }

        function closeRoom() {
            document.getElementById('room-screen').style.display = 'none';
            activeRoom = null;
            renderRooms();
        }

        function renderSeats() {
            const container = document.getElementById('seats-container');
            container.innerHTML = '';
            for(let i=0; i<10; i++) {
                let player = activeRoom.seats[i];
                let row = document.createElement('div');
                
                if(player) {
                    let isHost = (i === 0);
                    row.className = 'seat-row';
                    row.innerHTML = `
                        <div class="pv-avatar" style="width: 40px; height: 40px; font-size: 16px;">👤</div>
                        <div class="pv-info" style="margin-right: 10px;">
                            <div style="font-size: 14px; font-weight: bold;">${player.name} ${isHost ? '<span style="color:var(--tg-blue); font-size:11px;">(میزبان)</span>' : ''}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">صندلی شماره ${i+1}</div>
                        </div>
                        <div class="ready-badge ${player.ready ? 'is-ready' : ''}">✓</div>
                    `;
                } else {
                    row.className = 'seat-row empty';
                    row.innerHTML = `<span>+ نشستن روی صندلی شماره ${i+1}</span>`;
                    row.onclick = () => sitOnSeat(i);
                }
                container.appendChild(row);
            }
        }

        function sitOnSeat(index) {
            // Remove from previous seat if any
            activeRoom.seats.forEach((s, idx) => {
                if(s && s.name === 'کاربر نیورا') activeRoom.seats[idx] = null;
            });
            activeRoom.seats[index] = { name: 'کاربر نیورا', ready: false };
            mySeatIndex = index;
            isReadyState = false;
            document.getElementById('ready-btn').style.background = 'var(--green)';
            document.getElementById('ready-btn').innerText = 'آمادگی (تیک)';
            renderSeats();
        }

        function standUp() {
            if(mySeatIndex !== null) {
                activeRoom.seats[mySeatIndex] = null;
                mySeatIndex = null;
                renderSeats();
            }
        }

        function toggleReady() {
            if(mySeatIndex === null) {
                alert('ابتدا روی یک صندلی خالی بنشینید!');
                return;
            }
            isReadyState = !isReadyState;
            activeRoom.seats[mySeatIndex].ready = isReadyState;
            let btn = document.getElementById('ready-btn');
            if(isReadyState) {
                btn.style.background = 'var(--red)';
                btn.innerText = 'لغو آمادگی';
            } else {
                btn.style.background = 'var(--green)';
                btn.innerText = 'آمادگی (تیک)';
            }
            renderSeats();
        }

        function toggleRoomMenu() {
            let m = document.getElementById('room-menu-modal');
            m.classList.toggle('active');
        }

        function openInviteModal() {
            toggleRoomMenu();
            document.getElementById('invite-modal').classList.add('active');
        }

        function sendInvite(friendName) {
            document.getElementById('invite-modal').classList.remove('active');
            alert(`دعوت‌نامه برای ${friendName} ارسال شد!`);
        }

        function toggleMic() {
            alert('میکروفون فعال/غیرفعال شد');
        }

        function sendRoomMsg() {
            alert('پیام ارسال شد');
        }

        // Profile Image Upload Handling
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatar-preview').src = e.target.result;
                    document.getElementById('avatar-preview').style.display = 'block';
                    document.getElementById('avatar-placeholder').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function saveProfile() {
            alert('پروفایل با موفقیت ذخیره شد!');
        }

        // Initialize lobby
        renderRooms();
    </script>
</body>
</html>
