<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Nivra | Legend Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        /* --- استایل لابی --- */
        #lobby-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 1000;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 100%);
            transition: opacity 1.5s ease-in-out;
        }

        #game-title {
            font-size: 70px; font-weight: bold; color: white;
            letter-spacing: 15px; text-shadow: 0 0 30px rgba(0, 150, 255, 0.8);
            margin-bottom: 50px;
        }

        #start-btn {
            padding: 15px 60px; font-size: 24px; font-weight: bold;
            color: white; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 5px; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.3s;
            letter-spacing: 4px;
        }
        #start-btn:hover { background: rgba(0, 150, 255, 0.3); border-color: #0096ff; }

        /* --- استایل HUD --- */
        #game-ui {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500;
            pointer-events: none;
        }

        #player-profile {
            position: absolute;
            top: 20px; right: 20px;
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border-left: 4px solid #0096ff;
            color: white;
            pointer-events: auto;
        }

        #player-name {
            font-size: 22px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase;
            margin-left: 15px;
        }

        .profile-icon {
            width: 40px; height: 40px;
            background: linear-gradient(45deg, #0096ff, #ff0032);
            border-radius: 50%;
        }

        #orientation-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; color: white; text-align: center; 
            justify-content: center; align-items: center;
        }
        @media screen and (orientation: portrait) { #orientation-warning { display: flex; flex-direction: column; } }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div style="font-size: 50px;">🔄</div>
        <p>لطفاً گوشی را در حالت افقی نگه دارید</p>
    </div>

    <div id="lobby-container">
        <h1 id="game-title">NIVRA</h1>
        <button id="start-btn">START MISSION</button>
    </div>

    <div id="game-ui">
        <div id="player-profile">
            <div class="profile-icon"></div>
            <div id="player-name">W A S T I D</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let isGameStarted = false;
        let weaponGroup; // گروهی که اسلحه را نگه می‌دارد

        // ۱. تنظیمات پایه
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // فعال سازی سایه‌ها برای واقعی‌تر شدن
        document.body.appendChild(renderer.domElement);

        // ۲. لابی (ذرات)
        const particlesGeometry = new THREE.BufferGeometry();
        const count = 400;
        const posArray = new Float32Array(count * 3);
        for(let i=0; i<count * 3; i++) posArray[i] = (Math.random() - 0.5) * 15;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0x0096ff, transparent: true });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        const light = new THREE.PointLight(0x0096ff, 2, 50);
        light.position.set(0, 2, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 5;

        // ۳. ساخت محیط بازی (زمین و آسمان)
        function initWorld() {
            // زمین
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // آسمان تاریک
            scene.background = new THREE.Color(0x050505);
        }

        // ۴. ساخت اسلحه (Weapon Model)
        function createWeapon() {
            weaponGroup = new THREE.Group();

            // بدنه اصلی اسلحه (یک استوانه متمایل)
            const bodyGeo = new THREE.BoxGeometry(0.2, 0.2, 1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            
            // لوله اسلحه
            const barrelGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.z = -0.5;

            weaponGroup.add(body);
            weaponGroup.add(barrel);

            // قرار دادن اسلحه در جلوی دوربین
            weaponGroup.position.set(0.4, -0.4, -0.8); 
            camera.add(weaponGroup); // اسلحه فرزند دوربین می‌شود (با حرکت دوربین حرکت می‌کند)
            scene.add(camera); 
        }

        // ۵. انیمیشن‌ها
        function animateLobby() {
            if (!isGameStarted) {
                requestAnimationFrame(animateLobby);
                particlesMesh.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
        }

        function animateGame() {
            requestAnimationFrame(animateGame);
            
            // انیمیشن شناور بودن بسیار ملایم اسلحه (حس تنفس کاراکتر)
            if(weaponGroup) {
                weaponGroup.position.y = -0.4 + Math.sin(Date.now() * 0.002) * 0.01;
            }

            renderer.render(scene, camera);
        }

        // ۶. مدیریت شروع بازی
        const startBtn = document.getElementById('start-btn');
        const lobby = document.getElementById('lobby-container');
        const gameUI = document.getElementById('game-ui');

        startBtn.addEventListener('click', () => {
            isGameStarted = true;
            lobby.style.opacity = '0';
            setTimeout(() => {
                lobby.style.display = 'none';
                gameUI.style.display = 'block';
                initWorld();
                createWeapon();
                animateGame();
            }, 1500);
        });

        animateLobby();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
